<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas do Casal</title><link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d6456b">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#241f20;--mut:#7a6f72;--ac:#d6456b;--ok:#2e9e6b;--bd:#eadfe2;--warn:#d98a1c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18141a;--card:#231d26;--tx:#f3eef0;--mut:#a89aa0;--bd:#37303a;--ac:#ef6b8f;--ok:#4cc38a;--warn:#f0a73a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#18141a;--card:#231d26;--tx:#f3eef0;--mut:#a89aa0;--bd:#37303a;--ac:#ef6b8f;--ok:#4cc38a;--warn:#f0a73a;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:26px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.bar.d i{background:var(--ac)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--mut)}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--bd);color:var(--tx)}button.s{padding:6px 10px;font-size:14px}
button.x{background:none;color:var(--mut);padding:4px 8px}
input,select,textarea{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 8px}
label{font-size:12px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);border-radius:10px}nav button.on{color:var(--ac);font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{font-size:12px;color:var(--mut);margin-top:6px}
.pill{display:inline-block;margin-top:6px;font-size:13px;color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:24px 0}
#st{font-size:12px;color:var(--mut)}
textarea{min-height:140px;resize:vertical}
.alert{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;border:1px solid var(--warn);background:rgba(217,138,28,.15)}
.alert.r{border-color:var(--ac);background:rgba(214,69,107,.15)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{font-size:11px;color:var(--mut);padding-bottom:4px}
.day{background:none;color:var(--tx);padding:8px 0 4px;border-radius:10px;font-size:15px}
.day.hoje{border:1px solid var(--ac)}.day.sel{background:var(--ac);color:#fff}
.dots{display:flex;justify-content:center;gap:3px;height:6px;margin-top:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--ok)}.dots i.dv{background:var(--warn)}
.day.sel .dots i{background:#fff}
.badge{background:var(--ac);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;margin-left:4px}
</style>
</head>
<body>
<main>
  <div class="row"><div><h1>💑 Contas do Casal</h1><div class="sub" id="st">carregando…</div></div><button class="g s" onclick="cfg()">⚙️</button></div>
  <div id="v"></div>
</main>
<nav>
  <button data-t="r" onclick="go('r')">Resumo</button>
  <button data-t="d" onclick="go('d')">Dívidas</button>
  <button data-t="m" onclick="go('m')">Metas</button>
  <button data-t="a" onclick="go('a')">Agenda</button>
  <button data-t="n" onclick="go('n')">Notas</button>
</nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
let tab='r',items=[],names={a:'Eu',b:'Amor'},db=null,form=null,cal=new Date(new Date().getFullYear(),new Date().getMonth(),1),selDay=null;
const $=s=>document.querySelector(s);
const R=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const who=k=>k==='a'?names.a:k==='b'?names.b:'Juntos';
const LS='contas-casal';
const CATS=['Moradia','Alimentação','Transporte','Lazer','Viagem','Saúde','Cartão','Outros'];
function dias(i){return Math.round((new Date(i.due+'T12:00')-new Date(new Date().toDateString()+' 12:00'))/864e5)}
function avisos(){return items.filter(i=>i.type==='debt'&&i.due&&i.paid<i.total).map(i=>({i,d:dias(i)})).filter(x=>x.d<=7).sort((a,b)=>a.d-b.d)}
function avisosHtml(){return avisos().map(({i,d})=>`<div class="alert ${d<0?'r':''}">${d<0?'⚠️ Atrasada há '+(-d)+' dia(s)':d===0?'⏰ Vence hoje':'🔔 Vence em '+d+' dia(s)'}: <b>${esc(i.name)}</b> · falta ${R(i.total-i.paid)}</div>`).join('')}
function mensal(){const m={};items.forEach(i=>(i.log||[]).forEach(l=>{const d=new Date(l.d),k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');m[k]=m[k]||{p:0,j:0};m[k][i.type==='debt'?'p':'j']+=l.v}));return Object.keys(m).sort().slice(-6).map(k=>({k,...m[k]}))}
function grafico(){const M=mensal();if(!M.length)return '<div class="mut">Registre pagamentos e depósitos para ver o gráfico.</div>';const mx=Math.max(...M.map(x=>Math.max(x.p,x.j)),1),w=300,h=120,bw=w/M.length;let g='';M.forEach((x,n)=>{const hp=x.p/mx*(h-20),hj=x.j/mx*(h-20),x0=n*bw+bw*.12;g+=`<rect x="${x0}" y="${h-hp}" width="${bw*.36}" height="${hp}" rx="3" fill="var(--ac)"/><rect x="${x0+bw*.38}" y="${h-hj}" width="${bw*.36}" height="${hj}" rx="3" fill="var(--ok)"/><text x="${n*bw+bw/2}" y="${h+14}" font-size="10" text-anchor="middle" fill="var(--mut)">${x.k.slice(5)}/${x.k.slice(2,4)}</text>`});return `<svg viewBox="0 0 ${w} ${h+20}" width="100%" role="img">${g}</svg><div class="mut"><span style="color:var(--ac)">■</span> Pago em dívidas &nbsp; <span style="color:var(--ok)">■</span> Juntado nas metas</div>`}
function porCat(){const c={};items.filter(i=>i.type==='debt').forEach(i=>{const k=i.cat||'Outros';c[k]=(c[k]||0)+Math.max(0,i.total-i.paid)});const e=Object.entries(c).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),t=e.reduce((s,x)=>s+x[1],0)||1;return e.map(([k,v])=>`<div style="margin-top:8px"><div class="row"><span>${esc(k)}</span><b>${R(v)}</b></div><div class="bar d"><i style="width:${v/t*100}%"></i></div></div>`).join('')||'<div class="mut">Nada pendente 🎉</div>'}
function notas(){const L=items.filter(i=>i.type==='note').sort((a,b)=>b.ts-a.ts);return `<button style="width:100%;margin-bottom:12px" onclick="newNote()">+ Nova nota</button>`+(L.map(i=>`<div class="card"><div class="row"><b>${esc(i.name||'Sem título')}</b><span class="mut">${new Date(i.ts).toLocaleDateString('pt-BR')} · ${who(i.who)}</span></div><div style="white-space:pre-wrap;margin-top:6px">${esc(i.text)}</div><div style="margin-top:8px;text-align:right"><button class="x" onclick="edit('${i.id}')">Editar</button><button class="x" onclick="del('${i.id}')">🗑</button></div></div>`).join('')||'<div class="empty">Nenhuma nota ainda.</div>')}
const pad=n=>String(n).padStart(2,'0');
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function br(s){return new Date(s+'T12:00').toLocaleDateString('pt-BR')}
function mes(n){cal=new Date(cal.getFullYear(),cal.getMonth()+n,1);render()}
function agenda(){
  if(!selDay)selDay=ymd(new Date());
  const y=cal.getFullYear(),m=cal.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),hoje=ymd(new Date());
  const ev=items.filter(i=>i.type==='event'),dv=items.filter(i=>i.type==='debt'&&i.due&&i.paid<i.total);
  let c=['D','S','T','Q','Q','S','S'].map(x=>`<div class="wd">${x}</div>`).join('');
  for(let k=0;k<first;k++)c+='<div></div>';
  for(let d=1;d<=n;d++){const s=y+'-'+pad(m+1)+'-'+pad(d);
    c+=`<button class="day ${s===hoje?'hoje':''} ${s===selDay?'sel':''}" onclick="selDay='${s}';render()">${d}<span class="dots">${ev.some(x=>x.date===s)?'<i></i>':''}${dv.some(x=>x.due===s)?'<i class="dv"></i>':''}</span></button>`}
  const dia=ev.filter(x=>x.date===selDay).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const contas=dv.filter(x=>x.due===selDay);
  const lst=dia.map(i=>`<div class="card"><div class="row"><b>${i.time?esc(i.time)+' · ':''}${esc(i.name)}</b><span class="tag">${who(i.who)}</span></div>${i.note?`<div class="mut">${esc(i.note)}</div>`:''}<div style="text-align:right"><button class="x" onclick="edit('${i.id}')">Editar</button><button class="x" onclick="del('${i.id}')">🗑</button></div></div>`).join('')
   +contas.map(i=>`<div class="alert">💸 Vence: <b>${esc(i.name)}</b> · falta ${R(i.total-i.paid)}</div>`).join('');
  return `<div class="card"><div class="row" style="margin-bottom:10px"><button class="g s" onclick="mes(-1)">‹</button><b style="text-transform:capitalize">${cal.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</b><button class="g s" onclick="mes(1)">›</button></div><div class="cal">${c}</div>
  <div class="mut" style="margin-top:8px"><span style="color:var(--ok)">●</span> compromisso &nbsp; <span style="color:var(--warn)">●</span> vencimento de conta</div></div>
  <div class="row" style="margin-bottom:10px"><b>${br(selDay)}</b><button class="s" onclick="newEvent()">+ Compromisso</button></div>${lst||'<div class="empty">Nada neste dia.</div>'}`;
}
function newEvent(){form={type:'event',name:'',date:selDay||ymd(new Date()),time:'',who:'j',note:'',isNew:true};render()}
function evAvisosHtml(){const h=ymd(new Date()),a=ymd(new Date(Date.now()+864e5));return items.filter(i=>i.type==='event'&&(i.date===h||i.date===a)).sort((x,y)=>(x.date+(x.time||'')).localeCompare(y.date+(y.time||''))).map(i=>`<div class="alert">📅 ${i.date===h?'Hoje':'Amanhã'}${i.time?' às '+esc(i.time):''}: <b>${esc(i.name)}</b></div>`).join('')}
function newNote(){form={type:'note',name:'',text:'',who:'j',isNew:true};render()}
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');items=d.items||[];names=d.names||names}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({items,names}))}catch(e){}}
async function save(it){
  if(db){try{await db.collection('items').doc(it.id).set(it)}catch(e){$('#st').textContent='Erro ao salvar'}}
  else{const i=items.findIndex(x=>x.id===it.id);i<0?items.push(it):items[i]=it;lsSave();render()}
}
async function del(id){
  if(!confirm('Apagar este item?'))return;
  if(db){try{await db.collection('items').doc(id).delete()}catch(e){}}
  else{items=items.filter(x=>x.id!==id);lsSave();render()}
}
function go(t){tab=t;form=null;render()}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  const nb=avisos().length;document.querySelector('nav button[data-t=d]').innerHTML='Dívidas'+(nb?`<span class="badge">${nb}</span>`:'');
  $('#v').innerHTML=form?formHtml():tab==='r'?resumo():tab==='d'?lista('debt'):tab==='m'?lista('goal'):tab==='a'?agenda():notas();
}
function resumo(){
  const D=items.filter(i=>i.type==='debt'),G=items.filter(i=>i.type==='goal');
  const tot=D.reduce((s,i)=>s+i.total,0),pg=D.reduce((s,i)=>s+i.paid,0),falta=tot-pg;
  const alvo=G.reduce((s,i)=>s+i.total,0),jun=G.reduce((s,i)=>s+i.paid,0);
  const mens=G.reduce((s,i)=>s+(i.monthly||0),0);
  let por=['a','b','j'].map(k=>{const f=D.filter(i=>i.who===k).reduce((s,i)=>s+i.total-i.paid,0);return `<div class="row"><span>${who(k)}</span><b>${R(f)}</b></div>`}).join('');
  const prox=D.filter(i=>i.paid<i.total&&i.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,3)
    .map(i=>`<div class="row"><span>${esc(i.name)}</span><span class="mut">${new Date(i.due+'T12:00').toLocaleDateString('pt-BR')}</span></div>`).join('');
  return avisosHtml()+evAvisosHtml()+`<div class="card"><div class="mut">Ainda devemos</div><div class="big" style="color:var(--ac)">${R(falta)}</div>
  <div class="bar d"><i style="width:${tot?pg/tot*100:0}%"></i></div><div class="mut">Já pagamos ${R(pg)} de ${R(tot)}</div></div>
  <div class="card"><div class="mut">Juntado nas metas</div><div class="big" style="color:var(--ok)">${R(jun)}</div>
  <div class="bar"><i style="width:${alvo?Math.min(100,jun/alvo*100):0}%"></i></div>
  <div class="mut">Objetivo total ${R(alvo)} · planejado ${R(mens)}/mês</div>
  ${mens>0&&alvo>jun?`<div class="pill">Com esse ritmo, ~${Math.ceil((alvo-jun)/mens)} meses para completar tudo</div>`:''}</div>
  <div class="card"><b>Quanto cada um deve</b><div style="margin-top:8px">${por}</div></div>
  <div class="card"><b>Dívidas por categoria</b>${porCat()}</div>
  <div class="card"><b>Evolução por mês</b><div style="margin-top:8px">${grafico()}</div></div>
  ${prox?`<div class="card"><b>Próximos vencimentos</b><div style="margin-top:8px">${prox}</div></div>`:''}`;
}
function lista(t){
  const L=items.filter(i=>i.type===t);
  const isD=t==='debt';
  const cards=L.map(i=>{
    const p=i.total?Math.min(100,i.paid/i.total*100):0,left=Math.max(0,i.total-i.paid);
    let extra='';
    if(!isD&&i.monthly>0&&left>0)extra=`<div class="pill">Faltam ${Math.ceil(left/i.monthly)} meses (${R(i.monthly)}/mês)</div>`;
    if(isD&&i.due&&left>0)extra=`<div class="mut">Vence em ${new Date(i.due+'T12:00').toLocaleDateString('pt-BR')}</div>`;
    const h=(i.log||[]).slice(-3).reverse().map(l=>`${new Date(l.d).toLocaleDateString('pt-BR')} · ${R(l.v)} · ${who(l.w)}`).join('<br>');
    return `<div class="card"><div class="row"><b>${esc(i.name)}</b><span class="tag">${esc(i.cat||'Outros')} · ${who(i.who)}</span></div>
    <div class="bar ${isD?'d':''}"><i style="width:${p}%"></i></div>
    <div class="row"><span class="mut">${isD?'Pago':'Juntado'} ${R(i.paid)} / ${R(i.total)}</span><b>${left?R(left):'✅ Concluído'}</b></div>
    ${extra}${i.note?`<div class="mut">${esc(i.note)}</div>`:''}${h?`<div class="hist">${h}</div>`:''}
    <div class="row" style="margin-top:10px"><button class="s" onclick="pay('${i.id}')">${isD?'+ Pagamento':'+ Depósito'}</button>
    <span><button class="x" onclick="edit('${i.id}')">Editar</button><button class="x" onclick="del('${i.id}')">🗑</button></span></div></div>`}).join('');
  return (isD?avisosHtml():'')+`<button style="width:100%;margin-bottom:12px" onclick="newItem('${t}')">+ ${isD?'Nova dívida / conta':'Nova meta'}</button>${cards||`<div class="empty">Nada por aqui ainda.</div>`}`;
}
function newItem(t){form={type:t,name:'',total:'',paid:0,who:'j',cat:'Outros',due:'',monthly:'',note:'',isNew:true};render()}
function edit(id){form={...items.find(i=>i.id===id)};render()}
function formHtml(){
  const f=form,isD=f.type==='debt';
  if(f.type==='event')return `<div class="card"><b>${f.isNew?'Novo compromisso':'Editar compromisso'}</b><br><br>
  <label>O que é</label><input id="f_n" value="${esc(f.name)}" placeholder="Ex: Jantar, consulta, pagar boleto">
  <div class="g2"><div><label>Data</label><input id="f_dt" type="date" value="${f.date}"></div><div><label>Hora (opcional)</label><input id="f_h" type="time" value="${f.time||''}"></div></div>
  <label>De quem é</label><select id="f_w"><option value="a" ${f.who==='a'?'selected':''}>${esc(names.a)}</option><option value="b" ${f.who==='b'?'selected':''}>${esc(names.b)}</option><option value="j" ${f.who==='j'?'selected':''}>Juntos</option></select>
  <label>Observação</label><input id="f_o" value="${esc(f.note||'')}">
  <div class="g2"><button class="g" onclick="form=null;render()">Cancelar</button><button onclick="submitForm()">Salvar</button></div></div>`;
  if(f.type==='note')return `<div class="card"><b>${f.isNew?'Nova nota':'Editar nota'}</b><br><br>
  <label>Título</label><input id="f_n" value="${esc(f.name)}">
  <label>Texto</label><textarea id="f_x">${esc(f.text)}</textarea>
  <label>Quem escreveu</label><select id="f_w"><option value="a" ${f.who==='a'?'selected':''}>${esc(names.a)}</option><option value="b" ${f.who==='b'?'selected':''}>${esc(names.b)}</option><option value="j" ${f.who==='j'?'selected':''}>Juntos</option></select>
  <div class="g2"><button class="g" onclick="form=null;render()">Cancelar</button><button onclick="submitForm()">Salvar</button></div></div>`;
  return `<div class="card"><b>${f.isNew?'Novo':'Editar'}</b><br><br>
  <label>Nome</label><input id="f_n" value="${esc(f.name)}" placeholder="${isD?'Ex: Cartão, aluguel, empréstimo':'Ex: Viagem, reserva de emergência'}">
  <label>Categoria</label><select id="f_c">${CATS.map(c=>`<option ${(f.cat||'Outros')===c?'selected':''}>${c}</option>`).join('')}</select>
  <div class="g2"><div><label>${isD?'Valor total':'Valor da meta'}</label><input id="f_t" type="number" step="0.01" inputmode="decimal" value="${f.total}"></div>
  <div><label>${isD?'Já pago':'Já juntado'}</label><input id="f_p" type="number" step="0.01" inputmode="decimal" value="${f.paid}"></div></div>
  <label>De quem é</label><select id="f_w"><option value="a" ${f.who==='a'?'selected':''}>${esc(names.a)}</option><option value="b" ${f.who==='b'?'selected':''}>${esc(names.b)}</option><option value="j" ${f.who==='j'?'selected':''}>Juntos</option></select>
  ${isD?`<label>Vencimento</label><input id="f_d" type="date" value="${f.due}">`:`<label>Quanto planejam juntar por mês</label><input id="f_m" type="number" step="0.01" inputmode="decimal" value="${f.monthly}">`}
  <label>Observação</label><input id="f_o" value="${esc(f.note)}">
  <div class="g2"><button class="g" onclick="form=null;render()">Cancelar</button><button onclick="submitForm()">Salvar</button></div></div>`;
}
async function submitForm(){
  const f=form;
  if(f.type==='event'){const nm=$('#f_n').value.trim(),dt=$('#f_dt').value;if(!nm||!dt)return;
    const ev={id:f.id||'e'+Date.now().toString(36),type:'event',name:nm,date:dt,time:$('#f_h').value,who:$('#f_w').value,note:$('#f_o').value.trim()};
    selDay=dt;cal=new Date(+dt.slice(0,4),+dt.slice(5,7)-1,1);form=null;await save(ev);render();return}
  if(f.type==='note'){const nm=$('#f_n').value.trim(),tx=$('#f_x').value;if(!nm&&!tx.trim())return;
    const nt={id:f.id||'n'+Date.now().toString(36),type:'note',name:nm,text:tx,who:$('#f_w').value,ts:f.ts||Date.now()};
    form=null;await save(nt);render();return}
  const n=$('#f_n').value.trim();if(!n)return;
  const it={id:f.id||'i'+Date.now().toString(36),type:f.type,name:n,total:+$('#f_t').value||0,paid:+$('#f_p').value||0,who:$('#f_w').value,cat:$('#f_c').value,
    due:f.type==='debt'?$('#f_d').value:'',monthly:f.type==='goal'?(+$('#f_m').value||0):0,note:$('#f_o').value.trim(),log:f.log||[]};
  form=null;await save(it);render();
}
function pay(id){
  const it=items.find(i=>i.id===id);
  const v=parseFloat((prompt(`Quanto (R$)? — ${it.name}`)||'').replace(',','.'));
  if(!v)return;
  const w=(prompt(`Quem? 1 = ${names.a}, 2 = ${names.b}, 3 = Juntos`,'3')||'3').trim();
  const k=w==='1'?'a':w==='2'?'b':'j';
  save({...it,paid:it.paid+v,log:[...(it.log||[]),{d:Date.now(),v,w:k}].slice(-30)});
}
async function cfg(){
  const a=prompt('Seu nome:',names.a);if(a===null)return;
  const b=prompt('Nome do seu namorado(a):',names.b);if(b===null)return;
  names={a:a.trim()||'Eu',b:b.trim()||'Amor'};
  if(db){try{await db.doc('config/names').set(names)}catch(e){}}else{lsSave();}
  render();
}
